<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="static/automobile.png" type="image/x-icon"> 
    <style>
        body {
            background-color: #FFF5E1;
            color: #333;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        
        .login-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(44, 62, 80, 0.10);
            max-width: 400px;
            margin: 40px auto;
            padding: 36px 32px 36px 32px;
        }
        .login-card h1 {
            font-size: 1.7rem;
            color: #ff9800;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
        }
        .login-card .form-label {
            font-weight: 500;
        }
        .login-card .btn-primary {
            background: linear-gradient(90deg, #ff9800 0%, #ffd600 100%);
            color: #222;
            border: none;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .login-card .btn-primary:hover {
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 100%);
           
        }
        .navbar-simple {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 60%, #f44336 100%);
            border-radius: 0 0 24px 24px;
            box-shadow: 0 2px 12px rgba(255, 152, 0, 0.13);
            padding: 20px 15px;
            margin-bottom: 32px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            font-size: 2rem;
            font-weight: 700;
            color: #222;
           
            gap: 10px;
            letter-spacing: 2px;
        }
       
        
        .login-card #user {
            text-align: center;
            margin-top: 20px;
        }
        .login-card #user a {
            color: #ff9800;
            
            margin: 0 5px;
        }
        .login-card #user a:hover {
            color: #f44336;
            text-decoration: underline;
        }

        
        .form-control::placeholder {
            color: #6c757d; 
            opacity: 1; 
        }
    </style>
</head>
<body>
    <div class="navbar-simple">
        <i class="bi bi-car-front navbar-brand "aria-hidden="true">EsyPark</i> 
    </div>
    
    <div class="login-card">
        <h1>Login to Account</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{category}}">
                        {{ message }}
                         </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        <form action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter name" name="username" required>
            </div>
            
           
            <div class="mb-3">
                <label for="pwd" class="form-label">Password</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="password" required>
            </div>

            <input type="submit" class="btn btn-primary" value="Login">
        </form>
        
       
        <div id="user">
            <div>
                Are you a new user?
                <a href="/signup">Register here!</a>
            </div>
            
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

   
</body>
</html>
