<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lots - EsyPark</title>
    <link rel="shortcut icon" href="static/automobile.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: #fff;
            color: #222;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('static/car.jpg') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.5;
            filter: blur(3px);
            z-index: -1;
            pointer-events: none;
        }
        .navbar-simple {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 60%, #f44336 100%);
            border-radius: 0 0 24px 24px;
            box-shadow: 0 2px 12px rgba(255, 152, 0, 0.13);
            padding: 25px 20px;
            margin-bottom: 32px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            font-size: 2rem;
            font-weight: 700;
            color: #222;
            text-decoration: none;
            gap: 10px;
            letter-spacing: 2px;
        }
        .navbar-brand .bi-car-front {
            font-size: 2rem;
            color: #222;
        }
        .navbar-links a {
            color: #222;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 24px;
            margin-left: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .navbar-links a.active,
        .navbar-links a:hover {
            background: linear-gradient(90deg, #ff9800 0%, #ffd600 100%);
            color: #222;
        }
        .section-title {
            color: #ff9800;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-left: 6px solid #ff9800;
            border: 1.5px solid #ff9800;
            border-radius: 12px;
            opacity: 0.95;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 4px 16px rgba(255, 152, 0, 0.08);
            margin: 24px auto 12px auto;
            max-width: 700px;
            padding: 18px 32px;
            text-align: center;
        }
        .parking-history-section {
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(255, 152, 0, 0.08);
            max-width: 1100px;
            margin: 32px auto;
            padding: 24px 32px 32px 32px;
        }
        .parking-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            margin-bottom: 18px;
        }
        .parking-table th, .parking-table td {
            padding: 14px 18px;
            text-align: left;
            font-size: 1.1rem;
        }
        .parking-table th {
            background: #fafafa;
            font-weight: 600;
            color: #222;
            border-bottom: 2px solid #eee;
        }
        .parking-table tr {
            border-bottom: 1px solid #f0f0f0;
        }
        .parking-table tr:hover {
            background-color: lightgray;
        }
        
    </style>
</head>
<body>
    <div class="navbar-simple">
        <i class="bi bi-car-front navbar-brand "aria-hidden="true">EsyPark</i> 
        <div class="navbar-links">
            <a href="/admin_dash">Home</a>
            <a href="/admin_user" class="active">Users</a>
            <a href="/admin_summary">Summary</a>
            <a href="/logout">Logout</a>
            
        </div>
    </div>

    <div class="parking-history-section">
        <h3 class="section-title">User Details</h3>
        <table class="parking-table">
            <thead>
                <tr>
                    <th scope="col">Sr.No</th>
                    <th scope="col">UserName</th>
                    <th scope="col">Address</th>
                    <th scope="col">Pin Code</th>
                </tr>
            </thead>
            <tbody>
            {% for cam in cust %}
            
                <tr>
                    <td scope="row">{{cam.id}}</td>
                    <td scope="row">{{cam.username}}</td>
                    <td scope="row">{{cam.address}}</td>
                    <td scope="row">{{cam.pin_code}}</td>
                </tr>
        
            {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
