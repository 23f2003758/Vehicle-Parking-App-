


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/static/automobile.png" type="image/x-icon">
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <title>Book Parking Spot</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        .booking-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #fff3cd;
            border: 3px solid #333;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .booking-title {
           
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            padding: 10px;
            
        }
        
        .form-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .form-group label {
            width: 150px;
            font-weight: bold;
            margin-right: 15px;
        }
        
        .form-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .form-group input[readonly] {
            background-color: #f8f9fa;
            color: #ff8c00;
        }
        
        
        
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none; 
        }
        
       .btn-reserve, .btn-cancel {
        background-color: #87ceeb;
        color: #333;
        }
        .btn-reserve:hover, .btn-cancel:hover {
        background-color: #5f9ea0;
        }



    </style>
</head>




<body>

    <div class="booking-container">

        {% with messages = get_flashed_messages(with_categories=true) %} {% if
        messages %} {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %} {% endif %} {% endwith %} {% block content %} {% endblock %}



        <div class="booking-title">Book the parking spot</div>
        
        <form method="POST">
            <div class="form-group">
                <label for="spot_id">Spot_ID :</label>
                <input type="text" id="spot_id" name="spot_id" value="{{ spot_id }}" readonly>
            </div>
            
            <div class="form-group">
                <label for="lot_id">Lot_ID :</label>
                <input type="text" id="lot_id" name="lot_id" value="{{ lot_id }}" readonly>
            </div>
            
            <div class="form-group">
                <label for="vehicle_number">Vehicle Number :</label>
                <input type="text" id="vehicle_number" name="vehicle_number" required placeholder="Enter your vehicle number" required="">
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-reserve">Reserve</button>
               
                <a href="/user_dash/{{uid}}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
