<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #FFF5E1;
            color: #333;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .text-bg-success {
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 60%, #f44336 100%);
            color: #222;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 2px 12px rgba(255, 152, 0, 0.10);
            margin-bottom: 50px;
            padding: 22px 0;
            text-align: center;
        }
        .login-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(44, 62, 80, 0.10);
            max-width: 400px;
            margin: 40px auto;
            padding: 36px 32px 36px 32px;
        }
        .login-card h1, .login-card h2 {
            font-size: 1.7rem;
            color: #ff9800;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
        }
        .login-card .form-label {
            font-weight: 500;
        }
        .login-card .btn-primary {
            background: linear-gradient(90deg, #ff9800 0%, #ffd600 100%);
            color: #222;
            border: none;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .login-card .btn-primary:hover {
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 100%);
            color: #222;
        }
        .navbar-simple {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 60%, #f44336 100%);
            border-radius: 0 0 24px 24px;
            box-shadow: 0 2px 12px rgba(255, 152, 0, 0.13);
            padding: 20px 15px;
            margin-bottom: 32px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            font-size: 2rem;
            font-weight: 700;
            color: #222;
            text-decoration: none;
            gap: 10px;
            letter-spacing: 2px;
        }
        .navbar-brand .bi-car-front {
            font-size: 2rem;
            color: #222;
        }
        .navbar-links a {
            color: #222;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 24px;
            margin-left: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .navbar-links a.active,
        .navbar-links a:hover {
            background: linear-gradient(90deg, #ff9800 0%, #ffd600 100%);
            color: #222;
        }
        .login-card #user {
            text-align: center;
            margin-top: 20px;
        }
        .login-card #user a {
            color: #ff9800;
            text-decoration: underline;
            margin: 0 5px;
        }
        .login-card #user a:hover {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="navbar-simple">
        <a class="navbar-brand" href="/home">
            <i class="bi bi-car-front"></i>
            EsyPark
        </a>
        <div class="navbar-links">
            <a href="/home">Home</a>
            <a href="/adminlogin">Admin Login</a>
            <a href="/userlogin">User Login</a>
            <a class="active" href="/userregister">User Register</a>
        </div>
    </div>
    <div class="login-card">
        <h2>User Registration</h2>
        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}
        <form action="/userregister" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter name" name="u_name" required>
            </div>
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" placeholder="Enter Full Name" name="full_name" required>
            </div>
            <div class="mb-3">
                <label for="pwd" class="form-label">Password</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pwd" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" placeholder="Enter Address" name="address" required>
            </div>
            <div class="mb-3">
                <label for="pin_code" class="form-label">PinCode</label>
                <input type="number" class="form-control" id="pin_code" placeholder="Enter PinCode" name="pin_code" required>
            </div>
            <input type="submit" class="btn btn-primary" value="Register">
        </form>
        <div id="user">
            Already registered?
            <a href="/userlogin">Login</a>
        </div>
    </div>
</body>
</html>
