<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <link rel="shortcut icon" href="static/automobile.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #FFF5E1;
            color: #333;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
       
        .login-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(44, 62, 80, 0.10);
            max-width: 400px;
            margin: 40px auto;
            padding: 36px 32px 36px 32px;
        }
        .login-card h1, .login-card h2 {
            font-size: 1.7rem;
            color: #ff9800;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
        }
        .login-card .form-label {
            font-weight: 500;
        }
        .login-card .btn-primary {
            background: linear-gradient(90deg, #ff9800 0%, #ffd600 100%);
            color: #222;
            border: none;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .login-card .btn-primary:hover {
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 100%);
            
        }
        .navbar-simple {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 60%, #f44336 100%);
            border-radius: 0 0 24px 24px;
            box-shadow: 0 2px 12px rgba(255, 152, 0, 0.13);
            padding: 20px 15px;
            margin-bottom: 32px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            font-size: 2rem;
            font-weight: 700;
            gap: 10px;
            letter-spacing: 2px;
        }
        
        .login-card #user {
            text-align: center;
            margin-top: 20px;
        }
        .login-card #user a {
            color: #ff9800;
            text-decoration: underline;
            margin: 0 5px;
        }
        .login-card #user a:hover {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="navbar-simple">
        <i class="bi bi-car-front navbar-brand "aria-hidden="true">EsyPark</i> 
        
    </div>
    <div class="login-card">
        <h2>User Registration</h2>
         <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

        <form action="/signup" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter name" name="username" required>
            </div>
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" placeholder="Enter Full Name" name="fullname" required>
            </div>
            <div class="mb-3">
                <label for="pwd" class="form-label">Password</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" placeholder="Enter Address" name="address" required>
            </div>
            <div class="mb-3">
                <label for="pin_code" class="form-label">PinCode</label>
                <input type="number" class="form-control" id="pin_code" placeholder="Enter PinCode" name="pin_code" required>
            </div>
            <input type="submit" class="btn btn-primary" value="Register">
        </form>
        <div id="user">
            Already registered?
            <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
