<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Edit Parking Lot</title>
    <link rel="shortcut icon" href="/static/automobile.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: #fff;
            color: #222;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('/static/car.jpg') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.5;
            filter: blur(3px);
            z-index: -1;
            pointer-events: none;
        }
        .main-content {
            max-width: 820px;
            margin: 54px auto 0 auto;
            background: rgba(255,255,255,0.98);
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(255, 152, 0, 0.10);
            padding: 48px 54px 44px 54px;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .page-title {
            color: #ff9800;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }
        .btn-secondary {
            background: linear-gradient(90deg, #ffd600 0%, #ff9800 100%);
            color: #222;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 10px 28px;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            font-size: 1.08rem;
        }
        .btn-secondary:hover {
            background: linear-gradient(90deg, #ff9800 0%, #ffd600 100%);
            color: #fff;
        }
        .parking-form label {
            font-weight: 500;
            color: #ff9800;
            margin-bottom: 6px;
        }
        .parking-form input,
        .parking-form textarea {
            border-radius: 8px;
            border: 1.5px solid #ff9800;
            font-size: 1.13rem;
            padding: 14px 18px;
            margin-bottom: 18px;
            width: 100%;
            background: #fafafa;
            transition: border 0.2s;
        }
        .parking-form input:focus,
        .parking-form textarea:focus {
            outline: none;
            border-color: #23b04a;
            background: #fff;
        }
        .parking-form .row {
            display: flex;
            gap: 40px;
        }
        .parking-form .col-md-6 {
            flex: 1 1 0;
            min-width: 0;
        }
       
        .btn-add {
            width: 100%;
            margin-top: 22px;
            background: linear-gradient(90deg, #23b04a 0%, #ffd600 100%);
            color: #222;
            font-weight: 700;
            font-size: 1.18rem;
            border: none;
            border-radius: 8px;
            padding: 16px 0;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(35, 176, 74, 0.08);
            transition: background 0.2s, color 0.2s;
        }
        .btn-add:hover {
            background: linear-gradient(90deg, #188c36 0%, #ff9800 100%);
            color: #fff;
        }

    </style>
</head>
<body>
    <div class="main-content">
        <div class="header-section">
            <h1 class="page-title">Edit Parking Lot</h1>
            <a href="{{ url_for('admin_dash') }}" class="btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %} {% for category, message in messages %}
    <div
      class="alert alert-{{ category }} alert-dismissible fade show"
      role="alert"
    >
      {{ message }}
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
    {% endfor %} {% endif %} {% endwith %} {% block content %} {% endblock %}
            <form method="POST" class="parking-form">
                <div class="mb-3">
                    <label for="name" class="form-label">Lot Name</label>
                    <input type="text" id="name" name="prime_location_name" value="{{ Parking_lot.prime_location_name }}" required>
                </div>
                
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea id="address" name="address" rows="3" required>{{ Parking_lot.address }}</textarea>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="pin_code" class="form-label">Pin Code</label>
                        <input type="number" id="pin_code" name="pin_code" value="{{ Parking_lot.pin_code }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" id="price" name="price" value="{{ Parking_lot.price }}" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="max_spots" class="form-label">Maximum Number of Spots</label>
                    <input type="number" id="max_spots" name="max_spots" value="{{ Parking_lot.maximum_number_of_spots }}" required>
                </div>
                
                <button type="submit" class="btn-add">Update Parking Lot</button>
            </form>
        </div>
    </div>
</body>
</html>
