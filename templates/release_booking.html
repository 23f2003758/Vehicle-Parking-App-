<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Release</title>
    <link rel="shortcut icon" href="/static/automobile.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        .booking-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #fff3cd;
            border: 3px solid #333;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .booking-title {
           
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            padding: 10px;
            border-radius: 8px;
        }
        
        .form-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .form-group label {
            width: 150px;
            font-weight: bold;
            margin-right: 15px;
        }
        
        .form-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .form-group input[readonly] {
            background-color: #f0f0f0; 
            
            cursor: not-allowed;
        }
        
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none; /* Removes underline from link-based buttons */
        }
        
       
        .btn-release,
        .btn-cancel {
            background-color: #87ceeb;
            color: #333;
        }

        .btn-release:hover,
        .btn-cancel:hover {
            background-color: #5f9ea0;
        }

    </style>
</head>


<body>
    <div class="booking-container">
        <div class="booking-title">Spot Release</div>
        
        <form action="/release_parking_spot/{{ booking.id }}" method="post">
            
            <div class="form-group">
                <label for="booking_id">Booking ID:</label>
                <input type="text" id="booking_id" name="booking_id" value="{{ booking.id }}" readonly>
            </div>

            <div class="form-group">
                <label for="spot_id">Spot ID:</label>
                <input type="text" id="spot_id" name="spot_id" value="{{ booking.parking_spot_id }}" readonly>
            </div>

            <div class="form-group">
                <label for="vehicle_number">Vehicle Number:</label>
                <input type="text" id="vehicle_number" name="vehicle_number" value="{{ booking.vehicle_number }}" readonly>
            </div>

            <div class="form-group">
                <label for="parking_time">Parking Time:</label>
                <input type="text" id="parking_time" name="parking_time" value="{{ booking.parking_time.strftime('%b %d, %Y %I:%M %p') }}" readonly>
            </div>

            <div class="form-group">
                <label for="releasing_time">Releasing Time:</label>
                <input type="text" id="releasing_time" name="releasing_time" value="{{ leaving_time.strftime('%b %d, %Y %I:%M %p') }}" readonly>
            </div>

            <div class="form-group">
                <label for="duration">Duration (mins):</label>
                <input type="text" id="duration" name="duration" value="{{ duration//60 }}" readonly>
            </div>

            <div class="form-group">
                <label for="total_cost">Total Cost:</label>
                <input type="text" id="total_cost" name="total_cost" value="₹ {{ total_cost }}" readonly>
            </div>
            
            <div class="button-group">
               
                <button type="submit" class="btn btn-release">Release</button>
                <a href="/user_dash/{{ booking.user_id }}" class="btn btn-cancel">Cancel</a>
            </div>
        
        </form>
    </div>
</body>
</html>
